# بگودیت — اجرای واقعی ربات روی GitHub Actions (Polling) + Snapshot هفته اول
#
# الگوی اجرا:
#   • هر ۶ ساعت یک اجرای تازه شروع می‌شود و اجرای قبلی لغو می‌شود
#     (concurrency + cancel → هرگز دو instance هم‌زمان Polling نمی‌کنند → بدون Conflict)
#   • timeout هر اجرا ۳۵۰ دقیقه است؛ یعنی قبل از شروع اجرای بعدی تمام می‌شود
#   • ربات هنگام خاموشی (شامل لغو) Snapshot را می‌بندد و همین Job آن را به
#     مخزن کامیت می‌کند تا داده‌های هفته‌ی اول بین ری‌استارت‌ها حفظ شود
#
# توجه مهم: مخزن عمومی است — فایل snapshot حاوی رکورد کاربران است و پس از
# merge به main عمومی می‌شود. به‌محض انتقال به هاست واقعی، این بخش را
# غیرفعال کنید (SNAPSHOT_ENABLED=false) و فایل را از مخزن حذف کنید.

name: Bagoodit Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # UTC: 00:00 / 06:00 / 12:00 / 18:00
  push:
    branches: [main]
    paths: [".github/workflows/bot.yml"]

permissions:
  contents: write   # برای کامیت Snapshot هفته اول

concurrency:
  group: bagoodit-bot-polling
  cancel-in-progress: true

jobs:
  run-bot:
    name: Polling Runner
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gate — syntax + tests (دروازه‌ی اجرا)
        run: |
          python -m compileall -q .
          python tests/test_province_city.py
          python tests/test_audit_suite.py
          python tests/test_v2_suite.py

      - name: Pull latest snapshot (آخرین داده‌ها)
        run: |
          git config user.name "bagoodit-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase -X ours origin main || true

      - name: Start bot + save snapshot on exit
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          DB_PATH: ${{ secrets.DB_PATH }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          TEST_MODE_ENABLED: ${{ secrets.TEST_MODE_ENABLED }}
        run: |
          echo "Starting Bagoodit polling — stays alive until next scheduled run (~6h) or cancel."
          python bot.py
          EXIT_CODE=$?
          echo "Bot exited (code=$EXIT_CODE) — committing week-1 JSON snapshot…"
          if [ -f data/snapshot.json ]; then
            git add data/snapshot.json
            if git diff --cached --quiet; then
              echo "No snapshot changes."
            else
              git commit -m "chore: هفته اول — ذخیره Snapshot داده‌ها [skip ci]"
              git pull --rebase -X ours origin main || true
              git push origin main || echo "snapshot push failed (will retry next cycle)"
            fi
          else
            echo "No snapshot file (bot may have failed to start)."
          fi
          exit $EXIT_CODE
