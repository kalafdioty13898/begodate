# CI بگودیت — فقط تست؛ هرگز ربات را اجرا نمی‌کند (بدون توکن، بدون Polling)
name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bagoodit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: سینتکس + تست‌های سناریویی
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources (سینتکس همه فایل‌ها)
        run: python -m compileall -q .

      - name: Province/City registration tests (۸۸ چک)
        run: python tests/test_province_city.py

      - name: Full audit suite (۱۱۵ چک)
        run: python tests/test_audit_suite.py
